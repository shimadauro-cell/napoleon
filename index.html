<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>くるくる温泉ナポレオン部</title>
  <meta name="author" content="Shimada Uro">
  <meta name="copyright" content="© Shimada Uro">
  <meta name="description" content="くるくる温泉ナポレオン部 ── 5人で遊ぶトランプ「ナポレオン」。秘密の副官は誰だ？">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="viewport">
    <div id="stage">
      <!-- ============ タイトル ============ -->
      <section id="title" class="screen"></section>

      <!-- ============ 対戦画面 ============ -->
      <section id="game" class="screen hidden">
        <div class="bg-deco"></div>
        <div class="table-felt"></div>

        <div id="top-left" class="pill navy"></div>
        <div id="info-band"></div>
        <div class="top-buttons">
          <button class="icon-btn wide" id="btn-hint" title="ヒント（H）">ヒント<b></b></button>
          <button class="icon-btn" id="btn-bgm" title="BGM">♪</button>
          <button class="icon-btn" id="btn-se" title="効果音">SE</button>
          <button class="icon-btn" id="btn-speed" title="演出スピード">×1</button>
          <button class="icon-btn" id="btn-log" title="公開ログ（L）">ログ</button>
          <button class="icon-btn" id="btn-help" title="遊び方">?</button>
          <button class="icon-btn" id="btn-menu" title="メニュー">≡</button>
        </div>
        <div id="tally"></div>

        <div id="seats">
          <div class="seat" data-seat="0"></div>
          <div class="seat" data-seat="1"></div>
          <div class="seat" data-seat="2"></div>
          <div class="seat" data-seat="3"></div>
          <div class="seat" data-seat="4"></div>
        </div>

        <div id="trick-area"></div>
        <div id="discard-area"></div>
        <div id="center-panel" class="hidden"></div>
        <div id="trick-banner" class="hidden"></div>
        <div id="goal"></div>

        <div id="my-hand"></div>
        <div id="action-bar"></div>
        <div id="hint-box" class="hidden"></div>
        <button id="btn-last" class="small-btn">直前の札</button>
        <div id="log-panel" class="hidden"><div class="log-head">公開ログ<button class="log-close">×</button></div><div class="log-body"></div></div>
        <div id="spectate-bar" class="hidden"></div>
      </section>

      <div id="coach" class="hidden"><div class="coach-face"></div><div class="coach-body"><div class="coach-title">チュートリアル</div><div class="coach-text"></div><div class="coach-buttons"><button class="coach-quit">中断</button><button class="coach-next">つぎへ ▶</button></div></div></div>
      <div id="fx-layer"></div>
      <div id="modal-layer"></div>
      <div id="toast"></div>
      <div id="copyright">© Shimada Uro</div>
    </div>
  </div>
  <div id="rotate-note" class="hidden">
    <div class="rotate-box">
      <div class="rotate-icon">⟲</div>
      <p>横向きにすると遊べます</p>
      <button id="rot-help">遊び方</button><button id="rot-settings">設定</button>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/advisor.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/art.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/tutorial.js"></script>
</body>
</html>
